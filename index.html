<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Spotify Widget</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Draggable header -->
    <header class="widget-header">

        <span class="drag-area">
            SPOTIFY
        </span>

        <button
            id="close-button"
            aria-label="Close widget"
        >
            ×
        </button>

    </header>


    <!-- Main widget -->
    <main class="container">

        <p class="label">
            NOW PLAYING
        </p>


        <!-- Album artwork -->
        <div class="album-container">

            <div class="album-placeholder">
                🎵
            </div>

        </div>


        <!-- Song information -->
        <h1 id="song">
            Not playing
        </h1>

        <p id="artist">
            Open Spotify and play something
        </p>


        <!-- Playback status -->
        <div class="status">

            <span class="dot"></span>

            <span id="status-text">
                Waiting for Spotify
            </span>

        </div>

    </main>


    <!-- Renderer JavaScript -->
    <script src="renderer.js"></script>

</body>

</html>
